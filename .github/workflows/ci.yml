name: CI
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m py_compile app/service.py app/test_service.py
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s app -p 'test_*.py' -v
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with: {scan-type: fs, scan-ref: ., severity: CRITICAL,HIGH, ignore-unfixed: true}
  build-push-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, scan]
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [gateway, catalog, orders]}
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: 'ghcr.io/${{ github.repository_owner }}/capstone-${{ matrix.service }}:${{ github.sha }}'}
  update-gitops:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-push-update]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Update and commit staging tag
        env: {IMAGE_TAG: '${{ github.sha }}'}
        run: |
          python scripts/update-image-tags.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gitops/overlays/staging/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: deploy $IMAGE_TAG to staging"
          git push
