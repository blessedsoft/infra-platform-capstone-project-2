apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: capstone-alerts, namespace: observability, labels: {release: monitoring}}
spec:
  groups:
    - name: capstone.application
      rules:
        - alert: HighErrorRate
          expr: sum(rate(http_request_errors_total[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
          for: 5m
          labels: {severity: critical, team: platform}
          annotations: {summary: High application error rate, description: More than 5% of requests are failing., runbook_url: https://REPLACE_REPO/runbooks/high-error-rate.md}
        - alert: HighLatency
          expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 1
          for: 5m
          labels: {severity: warning, team: platform}
          annotations: {summary: High request latency, description: The service p99 latency exceeds one second., runbook_url: https://REPLACE_REPO/runbooks/high-latency.md}
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
          for: 10m
          labels: {severity: critical, team: platform}
          annotations: {summary: Pod is restarting, description: A pod restarted more than three times in one hour., runbook_url: https://REPLACE_REPO/runbooks/pod-crash-looping.md}
    - name: capstone.infrastructure
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels: {severity: critical, team: infrastructure}
          annotations: {summary: Kubernetes node is not ready, description: A node has been unavailable for five minutes., runbook_url: https://REPLACE_REPO/runbooks/node-not-ready.md}
        - alert: DiskSpaceLow
          expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.10
          for: 10m
          labels: {severity: warning, team: infrastructure}
          annotations: {summary: Disk space is low, description: A filesystem has less than ten percent free., runbook_url: https://REPLACE_REPO/runbooks/disk-space-low.md}
